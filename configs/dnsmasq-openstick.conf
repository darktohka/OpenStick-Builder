# dnsmasq configuration for the OpenStick wifi hotspot.
#
# Serves DHCP leases on 192.168.4.0/24 to clients connected to the hostapd
# access point running on wlan0.
#
# Notes:
#  - port=0 disables the DNS server. NetworkManager already runs its own
#    dnsmasq bound to 127.0.0.1:53, so enabling DNS here would fail to bind.
#  - DNS is handed out via dhcp-option instead, pointing clients at the LTE
#    network's upstream resolvers (100.100.x.x). Adjust if your carrier
#    provides different DNS servers (check: nmcli -g IP4.DNS dev show wwan0).
#  - bind-interfaces + interface=wlan0 keeps this DHCP server on the hotspot
#    link so it cannot conflict with NetworkManager's DHCP server for usb0.
interface=wlan0
bind-interfaces
listen-address=192.168.4.1
port=0
dhcp-range=192.168.4.10,192.168.4.250,255.255.255.0,1h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,100.100.1.1,100.100.0.1
no-hosts
