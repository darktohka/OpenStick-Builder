# SMS Gateway configuration
# See config.go for all available options

# Database
DB_DRIVER=sqlite
DB_DSN=/opt/sms-gateway/sms-gateway.db

# GSM modem AT port. On the MSM8916 OpenStick the modem is an SoC rpmsg
# device, not a USB serial dongle: the ports are /dev/wwan0at0 (kept by
# ModemManager for the cellular data connection) and /dev/wwan0at1 (reserved
# for sms-gateway by /etc/udev/rules.d/99-sms-gateway.rules).
DEVICE_PATH=/dev/wwan0at1
BAUD_RATE=115200

# HTTP server port
PORT=5174

# JWT secret (change this!)
JWT_SECRET=change-me-in-production
