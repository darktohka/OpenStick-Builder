[main]
dns=dnsmasq
plugins=ifupdown,keyfile

# wlan0 is handled by hostapd (openstick-hotspot.service), not by
# NetworkManager. Keeping it unmanaged prevents NetworkManager from running
# periodic wifi scans on the wcn36xx radio while hostapd tries to bring up
# the access point, which wedges the driver (see docs/hotspot.md).
[keyfile]
unmanaged-devices=interface-name:wlan0

[ifupdown]
managed=false
